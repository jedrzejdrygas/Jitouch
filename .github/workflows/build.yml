name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Validate shell scripts
        run: bash -n scripts/build.sh scripts/install.sh

      - name: Build and verify bundles
        run: ./scripts/build.sh

      - name: Confirm source-only repository
        run: |
          if git ls-files | grep -E '\.(app|prefPane|pkg)(/|$)'; then
            echo 'A binary bundle is tracked in the source repository.' >&2
            exit 1
          fi
